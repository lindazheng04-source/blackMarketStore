<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snored Industry Online - 赛博废土帝国经营 MUD</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col selection:bg-purple-500 selection:text-white">

    <!-- 顶部全局状态栏 -->
    <header class="bg-[#0e0e14] border-b border-[#1e1e2f] px-4 py-2 text-xs flex flex-wrap items-center justify-between gap-4 select-none">
        <div class="flex items-center gap-3">
            <span class="font-black text-purple-400 text-sm tracking-widest uppercase flex items-center gap-1.5">
                <span class="inline-block w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span>
                SNORED INDUSTRY ONLINE
            </span>
            <span class="text-zinc-500">|</span>
            <span class="text-zinc-400">自动存档: <span id="save-status" class="text-emerald-400 font-mono">已就绪</span></span>
        </div>
        <div class="flex items-center gap-4 font-mono">
            <span class="text-zinc-400">生存天数: <strong id="stat-days" class="text-amber-400">1</strong> 天</span>
            <span class="text-zinc-400">体力值: <strong id="stat-energy" class="text-cyan-400">100 / 100</strong></span>
            <span class="text-zinc-400">黑市负债: <strong id="stat-debt" class="text-rose-400">0</strong> 算力币</span>
            <span class="text-purple-400 bg-purple-950/40 px-2 py-0.5 rounded border border-purple-900/50">当前位置: 第 <span id="stat-floor">1</span> 层</span>
        </div>
    </header>

    <!-- 主布局容器 -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 p-3 max-w-[1700px] w-full mx-auto">

        <!-- 左侧面板 -->
        <section class="lg:col-span-3 flex flex-col gap-3">
            
            <!-- 新手引导任务 -->
            <div class="cyber-card border-purple-500/40 rounded-xl p-4 flex flex-col gap-2.5 bg-gradient-to-b from-purple-950/20 to-[#121218]">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="text-xs font-bold tracking-wider uppercase text-purple-300 flex items-center gap-1.5">
                        <span>📋</span> 新手引导任务
                    </h3>
                    <span id="quest-progress-text" class="text-[10px] font-mono text-purple-400">步骤 1/3</span>
                </div>
                <div class="text-xs text-zinc-300 flex flex-col gap-2">
                    <p id="quest-desc" class="font-medium text-zinc-200">目标加载中...</p>
                    <div class="w-full bg-zinc-900 h-2 rounded-full overflow-hidden border border-zinc-800">
                        <div id="quest-bar" class="bg-purple-500 h-full transition-all duration-300" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- 玩家面板 -->
            <div class="cyber-card cyber-card-glow rounded-xl p-4 flex flex-col gap-3">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 class="font-bold text-base text-zinc-100 flex items-center gap-2">
                            <span>zheng</span> 
                            <span class="text-xs font-normal px-2 py-0.5 bg-zinc-800 text-zinc-400 rounded-full font-mono">Lv.<span id="player-level">1</span> 拾荒者</span>
                        </h2>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="StorageManager.saveGame()" class="text-[10px] bg-purple-900/50 hover:bg-purple-800 text-purple-200 px-2 py-1 rounded transition">手动存档</button>
                        <button onclick="StorageManager.exportSave()" class="text-[10px] bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded transition">导出</button>
                    </div>
                </div>

                <div class="bg-[#09090d] rounded-lg p-3 border border-zinc-800/80 flex flex-col gap-2 font-mono">
                    <div class="flex justify-between text-xs">
                        <span class="text-zinc-400">流动资金 (算力币):</span>
                        <span id="player-money" class="text-emerald-400 font-bold text-sm">5,000</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-zinc-400">每秒净利润:</span>
                        <span id="player-income" class="text-cyan-400">+20.0 /s</span>
                    </div>
                </div>

                <!-- 资源仓库 -->
                <div class="flex flex-col gap-1.5 font-mono text-xs text-zinc-400">
                    <div class="flex justify-between">
                        <span>废土垃圾残渣:</span>
                        <span id="res-garbage" class="text-zinc-200 font-bold">0</span>
                    </div>
                    <div class="flex justify-between">
                        <span>合成芯片 (关键工业品):</span>
                        <span id="res-chips" class="text-cyan-300 font-bold">0</span>
                    </div>
                </div>

                <!-- 手动体力消耗动作 -->
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="Game.manualScavenge()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold py-2 px-3 rounded transition active:scale-95 cursor-pointer">
                        手柄搜寻 (-5 体力)
                    </button>
                    <button onclick="Game.manualProcess()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-bold py-2 px-3 rounded transition active:scale-95 cursor-pointer">
                        提炼芯片 (-10 体力)
                    </button>
                </div>
            </div>

            <!-- 自动化与高利贷 -->
            <div class="cyber-card rounded-xl p-4 flex flex-col gap-3">
                <h3 class="text-xs font-bold text-amber-400 border-b border-zinc-800 pb-2">🏦 金融与黑市交易</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="Game.sellChips()" class="col-span-2 bg-cyan-950/40 hover:bg-cyan-900/50 border border-cyan-800/40 text-cyan-300 text-xs py-2 rounded transition font-mono">
                        黑市变现芯片 (售价: 1,500/个)
                    </button>
                    <button onclick="Game.takeLoan(10000)" class="bg-amber-950/40 border border-amber-800/40 text-amber-300 text-xs py-1.5 rounded">借高利贷 1万</button>
                    <button onclick="Game.repayLoan(10000)" class="bg-emerald-950/40 border border-emerald-800/40 text-emerald-300 text-xs py-1.5 rounded">偿还 1万</button>
                </div>
            </div>
        </section>

        <!-- 中间面板 -->
        <section class="lg:col-span-6 flex flex-col gap-3">
            <div class="cyber-card rounded-xl p-4 flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-sm text-zinc-100">第 <span id="current-floor-num">1</span> 层店铺</h3>
                    </div>
                    <button onclick="Game.openNextFloor()" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-3 py-2 rounded transition shadow">🚀 进驻下一层</button>
                </div>

                <div class="bg-[#09090d] border border-zinc-800 rounded-lg p-3 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-purple-300" id="shop-name">垃圾分拣站</span>
                        <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded font-mono">Lv.<span id="shop-level">1</span></span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 font-mono text-xs text-zinc-400">
                        <div>维护费: <strong id="shop-upkeep" class="text-rose-400">10 /s</strong></div>
                        <div>基础产出: <strong id="shop-output" class="text-emerald-400">+30 /s</strong></div>
                    </div>
                    <button onclick="Game.upgradeShop()" class="w-full bg-purple-900/40 hover:bg-purple-800/50 border border-purple-700/50 text-purple-200 text-xs font-bold py-2 rounded transition">
                        升级店铺 (需要: <span id="shop-upgrade-cost">2500</span> 算力币 + <span id="shop-upgrade-chips">2</span> 芯片)
                    </button>
                </div>
            </div>

            <!-- MUD 日志终端 -->
            <div class="cyber-card rounded-xl p-3 flex flex-col gap-2">
                <div class="flex justify-between items-center text-xs text-zinc-400 border-b border-zinc-800 pb-1">
                    <span class="font-mono">MUD 实时终端日志</span>
                </div>
                <div id="mud-console" class="bg-[#060609] border border-zinc-900 rounded-lg p-3 h-48 overflow-y-auto font-mono text-xs flex flex-col gap-1.5"></div>
            </div>
        </section>

        <!-- 右侧面板 -->
        <section class="lg:col-span-3 flex flex-col gap-3">
            <div class="cyber-card rounded-xl p-4 flex flex-col gap-3">
                <h3 class="text-xs font-bold text-zinc-400 border-b border-zinc-800 pb-2">🏢 楼层图谱</h3>
                <div class="flex flex-col gap-2" id="floor-list-container"></div>
            </div>
        </section>

    </main>

    <!-- 脚本加载（按顺序模块化加载） -->
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/quest.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
